<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Mahala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Jost:wght@300;400;500&family=Marcellus&display=swap">
<script src="site.js?v=8"></script>
<script src="assets/shim/claude-shim.js?v=5"></script>
<style>
/* Your Mahala, prototype 2 (4 Nov 2026). One page about you, the same on the site and in the Mahalaverse.
   The people here are made up; nothing is read from or saved to the member database.
   The events come from Mahala OS operations/2027/events.yaml (public rows and public fields only, as export_events.py
   writes them) and the deck from the Mahalaverse's own archetype cards.
   Mahala OS: strategy/your-mahala-accounts-plan-2026-11-04.md and strategy/your-mahala-panel-review-2026-11-04.md */
:root {
  color-scheme: light;
  --ink: #2A221C; --ink-2: #5B5047; --ink-3: #6F6357;
  --warm: #F4EFE6; --paper: #F7F2EA; --paper-2: #EFE7DA; --sheet: #FBF8F3; --rule: #DCD2C3; --rule-2: #C9BCA9;
  --yellow: #FFD81F; --cyan: #14A8E0; --magenta: #D8197F; --ok: #2E6B4F;
  --yellow-ink: #6E5600; --cyan-ink: #0B6E95; --magenta-ink: #A3105E;
  --name: "Marcellus", Georgia, serif;
  --text: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --verse: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --ease: cubic-bezier(.2, .7, .1, 1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--warm); color: var(--ink); font: 400 16px/1.55 var(--text); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--warm); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan-ink); outline-offset: 3px; border-radius: 6px; }
section, details, .chapter, .ticket { scroll-margin-top: 80px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--warm) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.mark { font: 400 18px/1 var(--name); letter-spacing: .18em; text-decoration: none; }
.sp { flex: 1; }
.tellbtn { border: 0; background: var(--magenta); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; min-height: 40px; }
.chipname { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; cursor: pointer; min-height: 40px; }
.chipname svg { width: 30px; height: 30px; border-radius: 50%; display: block; }

/* prototype strip */
.proto { background: var(--ink); color: var(--warm); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto-in { max-width: 1080px; margin: 0 auto; display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.proto b { font-weight: 500; letter-spacing: .1em; text-transform: uppercase; font-size: 11.5px; color: var(--yellow); }
.seg { display: inline-flex; gap: 2px; flex-wrap: wrap; }
.seg a { text-decoration: none; padding: 6px 12px; border-radius: 999px; color: rgba(244, 239, 230, .85); border: 1px solid rgba(244, 239, 230, .3); }
.seg a[aria-current="page"] { background: var(--warm); color: var(--ink); border-color: var(--warm); }
.proto small { color: rgba(244, 239, 230, .75); }

.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* the altar: card, name, the Golden Seed of Life */
.altar { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); grid-template-areas: "card head" "card rest"; gap: 0 56px; align-items: start; }
.cardzone { grid-area: card; } .whohead { grid-area: head; min-width: 0; } .whorest { grid-area: rest; min-width: 0; }
.cardzone { display: grid; justify-items: center; gap: 14px; position: relative; padding-top: 6px; }
.cardstage { position: relative; display: flex; gap: 14px; align-items: flex-start; justify-content: center; }
.halo { position: absolute; inset: -18px -26px; background: conic-gradient(from 200deg, var(--yellow), var(--cyan), var(--magenta), var(--yellow)); opacity: .2; filter: blur(26px); border-radius: 40%; pointer-events: none; }
.card { position: relative; width: 168px; aspect-ratio: 300 / 406; perspective: 900px; }
.card .face { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px -22px rgba(42, 34, 28, .75); background: var(--paper-2); backface-visibility: hidden; transition: transform .6s var(--ease); }
.card .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .back { transform: rotateY(180deg); background: var(--ink); color: var(--warm); padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.card.turned .front { transform: rotateY(-180deg); }
.card.turned .back { transform: rotateY(0); }
.card.own { transform: rotate(-3deg); }
.card .back b { font: 400 15px/1.2 var(--name); letter-spacing: .05em; }
.card .back p { margin: 0; font-size: 12.5px; line-height: 1.45; }
.card .back q { font: italic 400 16px/1.25 var(--verse); quotes: none; }
.cardname { text-align: center; font-size: 14px; color: var(--ink-2); max-width: 30ch; }
.cardname b { display: block; font: 400 17px/1.2 var(--name); letter-spacing: .06em; color: var(--ink); }
.cardbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.draw { width: 168px; }
.drawn { display: grid; justify-items: center; gap: 8px; text-align: center; max-width: 340px; }
.drawn .msg { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; text-align: left; }
.drawn .msg q { display: block; font: italic 400 19px/1.3 var(--verse); quotes: none; margin-bottom: 6px; color: var(--ink); }
.drawn .msg span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 6px; }

/* beads beside the card */
.beads { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.bead { width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; box-shadow: inset -3px -4px 6px rgba(0, 0, 0, .18), inset 2px 3px 4px rgba(255, 255, 255, .5); position: relative; }
.bead.big { width: 28px; height: 28px; }
.bead[aria-expanded="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.bead::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 10px; background: var(--rule-2); }
.bead:last-child::after { display: none; }
.beadsay { font-size: 13.5px; color: var(--ink-2); min-height: 1.4em; text-align: center; max-width: 34ch; }

.who { min-width: 0; }
.hello { font: italic 400 21px/1.2 var(--verse); color: var(--ink-2); margin: 0; }
h1 { font: 400 clamp(38px, 7vw, 56px)/1.02 var(--name); letter-spacing: .04em; margin: 2px 0 0; text-wrap: balance; }
.playa { margin: 6px 0 0; color: var(--ink-2); }
.playa i { font-family: var(--verse); font-size: 19px; color: var(--ink); }
.sleeps { margin: 10px 0 0; font-size: 14px; color: var(--ink-3); letter-spacing: .02em; }
.hats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.hat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--rule-2); border-radius: 999px; padding: 4px 11px; background: var(--sheet); color: var(--ink-2); }
.hat svg { width: 14px; height: 14px; }

/* the Golden Seed of Life: six ways of belonging around the centre, no top */
.seedlife { margin-top: 22px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 8px 22px; align-items: center; }
.seedlife svg { width: 210px; height: 210px; overflow: visible; }
.way { cursor: pointer; }
.hit { fill: transparent; pointer-events: all; }
.way:focus-visible { outline: none; }
.way:focus-visible .hit { stroke: var(--cyan-ink); stroke-width: 2; }
.wayc { fill: transparent; stroke: #CDBB97; stroke-width: 1; stroke-dasharray: 3 3; transition: fill-opacity .6s var(--ease), stroke .3s; pointer-events: none; }
.wayc.open { fill: url(#gold); fill-opacity: .34; stroke: #B8862F; stroke-width: 1.4; stroke-dasharray: none; }
.wayc.sel { stroke: var(--ink); stroke-width: 2.2; stroke-dasharray: none; }
.wayc.bloom { animation: bloom 1.2s var(--ease) both; transform-box: fill-box; transform-origin: center; }
@keyframes bloom { from { fill-opacity: 0; transform: scale(.6); } to { fill-opacity: .34; transform: scale(1); } }
.frame { fill: none; stroke: #B8862F; stroke-width: 1.2; opacity: .55; }
.centre { fill: url(#gold); fill-opacity: .16; stroke: #B8862F; stroke-width: 1.6; pointer-events: none; }
.ring { fill: none; stroke: #CDBB97; stroke-width: 1; }
.seedc { fill: var(--ink); }
.seedt { font: 400 5.6px var(--name); letter-spacing: .12em; fill: #F3D27A; text-anchor: middle; pointer-events: none; }
.season { font-size: 15px; color: var(--ink-2); }
.season b { display: block; font: 400 12px/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.petalsay { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--cyan); background: var(--sheet); border-radius: 0 10px 10px 0; font-size: 14.5px; min-height: 3em; }
.petalsay strong { font-weight: 500; }
.rings { font-size: 13px; color: var(--ink-3); margin-top: 6px; }

/* the invitation */
.letter { margin-top: 26px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 18px 20px; position: relative; }
.letter::before { content: ""; position: absolute; left: 20px; top: -6px; width: 34px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--yellow), var(--cyan), var(--magenta)); }
.letter .from { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.letter p { margin: 6px 0 12px; font-size: 16.5px; max-width: 58ch; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 10px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--warm); text-decoration: none; cursor: pointer; font-size: 15px; min-height: 44px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule-2); }
.btn.small { padding: 7px 14px; font-size: 14px; min-height: 40px; }
.btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.link { background: none; border: 0; padding: 4px 0; color: var(--cyan-ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14.5px; min-height: 32px; }
.said { font-size: 14px; color: var(--ok); min-height: 1.4em; margin: 8px 0 0; }

/* role doors */
details.door { margin-top: 14px; border-radius: 18px; background: var(--ink); color: var(--warm); overflow: hidden; }
details.door summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; align-items: center; gap: 12px; min-height: 56px; }
details.door summary::-webkit-details-marker { display: none; }
details.door summary b { font: 400 20px/1.2 var(--name); letter-spacing: .05em; font-weight: 400; }
details.door summary span { font-size: 13.5px; color: rgba(244, 239, 230, .75); }
details.door summary::after { content: "+"; margin-left: auto; font-size: 22px; line-height: 1; }
details.door[open] summary::after { content: "\2212"; }
.doorin { padding: 0 20px 18px; }
.doorin p { margin: 0 0 12px; color: rgba(244, 239, 230, .85); font-size: 15px; max-width: 62ch; }
.doorin ul { list-style: none; margin: 0 0 14px; padding: 0; }
.doorin li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(244, 239, 230, .14); font-size: 15px; }
.doorin li small { display: block; color: rgba(244, 239, 230, .7); font-size: 13px; }
.pill { font-size: 12.5px; border-radius: 999px; padding: 3px 10px; background: rgba(244, 239, 230, .12); align-self: center; white-space: nowrap; }
.doorin .btn { background: var(--warm); color: var(--ink); border-color: var(--warm); }
.doorin .btn.ghost { background: transparent; color: var(--warm); border-color: rgba(244, 239, 230, .4); }
.doorin .said { color: #BDEBD2; }

/* movements */
.movement { margin-top: 56px; position: relative; }
.movement > h2 { font: 400 clamp(26px, 4vw, 32px)/1.1 var(--name); letter-spacing: .05em; margin: 0; }
.movement > .lede { margin: 6px 0 20px; color: var(--ink-2); max-width: 60ch; }
.curve { display: block; width: 100%; height: 40px; margin-top: 48px; }
.curve path { fill: none; stroke: var(--rule-2); stroke-width: 1; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 48px; }
h3 { font: 400 19px/1.2 var(--name); letter-spacing: .05em; margin: 0 0 4px; }
.sub { color: var(--ink-3); font-size: 14px; margin: 0 0 14px; }

/* gatherings as tickets */
.tickets { display: grid; gap: 12px; }
.ticket { --notch: radial-gradient(circle at 0 50%, transparent 9px, #000 9.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #000 9.5px) right / 51% 100% no-repeat;
  -webkit-mask: var(--notch); mask: var(--notch); background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; }
.ticket > button.head { width: 100%; text-align: left; background: none; border: 0; padding: 14px 18px 14px 20px; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 14px; align-items: center; cursor: pointer; }
.tdate { text-align: center; line-height: 1; border-right: 1px dashed var(--rule-2); padding-right: 12px; }
.tdate b { display: block; font: 400 28px/1 var(--name); }
.tdate span { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.ttitle b { display: block; font-weight: 500; font-size: 16px; }
.ttitle span { font-size: 13.5px; color: var(--ink-3); }
.stamp { font-size: 12px; letter-spacing: .06em; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--rule-2); color: var(--ink-2); white-space: nowrap; }
.stamp.going { background: var(--ok); border-color: var(--ok); color: #fff; animation: stamp .25s var(--ease); }
.stamp.held { background: color-mix(in srgb, var(--yellow) 30%, var(--sheet)); border-color: transparent; color: var(--yellow-ink); }
@keyframes stamp { from { transform: scale(1.4); } to { transform: scale(1); } }
.tbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.ticket.open .tbody { grid-template-rows: 1fr; }
.tbody > div { overflow: hidden; }
.tin { padding: 0 20px 18px 20px; border-top: 1px dashed var(--rule-2); margin: 0 10px; padding-top: 14px; display: grid; gap: 10px; font-size: 15px; }
.tin dl { margin: 0; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 12px; }
.tin dt { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; }
.tin dd { margin: 0; }
.tin dd small { display: block; color: var(--ink-3); font-size: 13.5px; }
.tq { font: italic 400 20px/1.3 var(--verse); margin: 0; padding-left: 14px; border-left: 3px solid var(--magenta); }
.ask { background: var(--paper); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.ask label, .ask legend { font-size: 14px; color: var(--ink-2); }
.ask fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
.choice { display: flex; gap: 6px; flex-wrap: wrap; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice label { border: 1px solid var(--rule-2); border-radius: 999px; padding: 6px 12px; cursor: pointer; background: var(--sheet); font-size: 14px; color: var(--ink); min-height: 36px; display: inline-flex; align-items: center; }
.choice input:checked + label { background: var(--ink); color: var(--warm); border-color: var(--ink); }
.choice input:focus-visible + label { outline: 2px solid var(--cyan-ink); outline-offset: 2px; }
.ask textarea { font: inherit; font-size: 15px; border: 1px solid var(--rule-2); border-radius: 10px; padding: 8px 10px; background: #fff; color: var(--ink); width: 100%; }
.only { font-size: 13px; color: var(--ink-3); }
.season-link { margin-top: 12px; }

/* your path: one thread */
.thread { list-style: none; margin: 0; padding: 0 0 0 26px; position: relative; }
.thread::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--yellow), var(--cyan), var(--magenta)); opacity: .45; border-radius: 2px; }
.knot { position: relative; padding: 0 0 18px; }
.knot::before { content: ""; position: absolute; left: -24px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--warm); border: 2px solid var(--ink-2); }
.knot.chapter::before { width: 18px; height: 18px; left: -26px; top: 3px; background: var(--ink); border-color: var(--ink); }
.knot.glow::before { border-color: var(--cyan-ink); box-shadow: 0 0 0 5px color-mix(in srgb, var(--cyan) 22%, transparent); }
.knot.waiting::before { border-style: dashed; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .4; } }
.knot b { font-weight: 500; }
.knot.chapter b { font: 400 18px/1.3 var(--name); letter-spacing: .04em; font-weight: 400; }
.knot span { display: block; font-size: 14.5px; color: var(--ink-2); }
.quest { margin-top: 8px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; }
.quest .crew { font-size: 13px; color: var(--ink-3); }
.steps { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }
.steps button { width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; background: none; border: 0; padding: 6px 4px; border-radius: 8px; cursor: pointer; min-height: 44px; }
.steps button:hover { background: var(--paper); }
.steps .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--ink-2); display: grid; place-items: center; font-size: 12px; margin-top: 1px; }
.steps [data-s="mine"] .box { background: var(--cyan-ink); border-color: var(--cyan-ink); color: #fff; }
.steps [data-s="ok"] .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps [data-s="ok"] { cursor: default; }
.steps svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.steps small { display: block; font-size: 13px; color: var(--ink-3); }

/* what you carry */
.gifts { margin: 0; display: grid; gap: 12px; }
.gifts dt { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.gifts dd { margin: 2px 0 0; }
.gifts dd small { color: var(--ink-3); font-size: 13px; }
.seedring { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: center; }
.seedring svg { width: 170px; height: 170px; }
.seedring ul { list-style: none; margin: 0; padding: 0; font-size: 14px; display: grid; gap: 4px; }
.seedring li span { color: var(--ink-3); }
.mine { margin-top: 12px; font-size: 14.5px; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--rule-2); }
.mine small { display: block; color: var(--ink-3); font-size: 13px; }

.portal { margin-top: 56px; display: flex; gap: 16px 24px; align-items: center; flex-wrap: wrap; padding: 22px; border-radius: 22px; background:
  radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--magenta) 14%, transparent), transparent 55%), radial-gradient(120% 160% at 0% 100%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 55%), var(--sheet); border: 1px solid var(--rule); }
.portal p { margin: 0; flex: 1 1 280px; min-width: 0; color: var(--ink-2); }
.portal p b { display: block; color: var(--ink); font: 400 21px/1.2 var(--name); letter-spacing: .04em; font-weight: 400; margin-bottom: 2px; }

/* sheets: your choices, tell us */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: min(640px, 100%); max-height: 88vh; border-radius: 22px 22px 0 0; background: var(--warm); color: var(--ink); box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, .4); }
@media (min-width: 760px) { dialog.sheet { margin: auto; border-radius: 22px; } }
dialog.sheet::backdrop { background: rgba(20, 14, 10, .5); }
.sheetin { padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); overflow: auto; max-height: 88vh; }
.sheethead { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheethead h2 { font: 400 26px/1.1 var(--name); letter-spacing: .05em; margin: 0; flex: 1; }
.x { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.sheet h3 { margin-top: 22px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.field small { display: block; color: var(--ink-3); font-size: 13px; }
.field small.carried { color: var(--cyan-ink); }
select { font: inherit; font-size: 14px; border: 1px solid var(--rule-2); border-radius: 999px; padding: 6px 10px; background: var(--sheet); color: var(--ink); min-height: 38px; }
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw .track { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--paper-2); border: 1.5px solid var(--ink-3); transition: background .2s; }
.sw .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--ink-3); transition: transform .2s var(--ease); }
.sw input:checked + .track { background: var(--ok); border-color: var(--ok); }
.sw input:checked + .track::after { transform: translateX(18px); background: #fff; }
.sw input:focus-visible + .track { outline: 2px solid var(--cyan-ink); outline-offset: 2px; }
.sw .yn { min-width: 2em; }
.keeps { margin: 0; padding: 0; list-style: none; font-size: 14.5px; }
.keeps li { padding: 8px 0; border-top: 1px solid var(--rule); }
.keeps li small { display: block; color: var(--ink-3); font-size: 13px; }
.leave { display: grid; gap: 10px; }
.leave .btn { justify-content: flex-start; text-align: left; }
.tellbox label { display: block; font-size: 14px; color: var(--ink-2); margin: 12px 0 4px; }
.tellbox select, .tellbox textarea { width: 100%; }
.tellbox textarea { font: inherit; font-size: 15px; border: 1px solid var(--rule-2); border-radius: 12px; padding: 8px 10px; background: #fff; color: var(--ink); }
.yours { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.yours li { padding: 8px 0; border-top: 1px solid var(--rule); }
.yours li small { display: block; color: var(--ink-3); }

@media (max-width: 860px) {
  .altar { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "card" "rest"; gap: 22px; }
  .whohead { text-align: center; }
  .hats { justify-content: center; }
  .seedlife { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .petalsay { text-align: left; width: 100%; }
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 420px) {
  .card, .draw { width: 140px; }
  .tellbtn { padding: 8px 12px; }
  .top .where { display: none; }
  .ticket > button.head { grid-template-columns: 50px minmax(0, 1fr); }
  .ticket .stamp { grid-column: 2; justify-self: start; }
  .seedring { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .tin dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .tin dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

-05-02","where":"Tankwa Karoo","blurb":"The Seed stands at Mahala, open day and night.","set":true}]}/*END*/;
  var DECK = [{"k":"alchemist","t":"The Alchemist","cap":"Transformation Master turning ideas into reality","g":"This card calls on you to recognize the tools already within your grasp (your knowledge, experience, passion, and vision) and begin the sacred process of transformation. Trust the process. Mix, mold, test, refine. What once lived only in your imagination is ready to be brought to life.","q":"What are you being called to bring into the world?","s":"When the Alchemist is out of alignment, the pursuit of transformation can become obsession or manipulation. You may be attempting to control outcomes, forcing growth without honoring the process. Or perhaps you are stuck in endless planning, endlessly dreaming, never taking action. This can look like perfectionism, burnout, or staying lost in the planning stage, never grounding the vision. Alternatively, it may be the misuse of one's gifts, crafting illusions instead of truth. The shadow Alchemist becomes a trickster, promising gold but delivering nothing but dust.","sq":"Where are you trying to skip the sacred mess of the creative process?"},{"k":"conductor","t":"The Conductor","cap":"Aligning visions into a cohesive masterpiece, guiding every note into perfect harmony","g":"This card represents leadership, coordination, and the ability to bring disparate elements into harmony, suggesting you are in a position to lead, to align people with a shared vision, and create something greater than the sum of its parts. Whether in work, relationships, or personal projects, you are being asked to direct with purpose, balancing structure with intuition while allowing space for improvisation. Trust in your ability to hold the vision while allowing the inputs and perspectives of others weave into the symphony.","q":"Where are you being asked to step up as the leader of a great vision?","s":"In their shadow, the Conductor may become overly controlling and rigid, micromanaging every detail to the point of stifling spontaneity and creativity. Instead of guiding with fluidity, they may impose rigid structures, fearing that without their control, everything will fall apart. In this state, the Conductor might struggle with trusting others, feeling the need to oversee every step instead of allowing the natural rhythm of collaboration to play its song. Their obsession with timelines and precision can cause them to miss the beauty of imperfection, rejecting moments of unpredictability that could lead to even greater magic.","sq":"How can you lead with clarity while leaving space for spontaneity?"},{"k":"entertainer","t":"The Entertainer","cap":"Setting the stage for connection with presence & flair","g":"This card is calling you to embrace your personal power, to shine without fear, and to create space for others to feel seen and uplifted. The Entertainer understands that joy is a gateway to transformation. By stepping fully into your role as a conduit for wonder, you invite others to do the same.","q":"Where are you playing small or afraid to be seen under the spotlight?","s":"The shadow of the Entertainer emerges when the need to captivate and uplift others becomes a mask, hiding insecurities of being truly seen, using a persona to avoid vulnerability while keeping others entertained. They may seek validation through applause, relying on external approval rather than genuine self-worth. This ends up draining their energy in an endless cycle of giving without replenishing, overcompensating with exaggerated antics rather than embracing the quiet power of presence. In an attempt to always take center stage, they might not realize where they are taking away the opportunity for someone else to shine.","sq":"How can you use joy as a tool for deeper connection and meaning?"},{"k":"guardian","t":"The Guardian","cap":"Protector of truth, keeper of trust, holder of space","g":"This card appears when you are called to stand in protection, whether of yourself, a loved one, a vision, or a sacred space in your life. You may need to set clearer boundaries, honor your own limits, or watch over something precious. Trust that your presence holds immense power. Stand firm in your values and create space for what truly matters, whether that's a dream, a relationship, a truth, or a place. Know that your strength lies in your devotion.","q":"What boundaries do you need to honor in order to protect something meaningful?","s":"The Guardian's Shadow emerges when protection turns into control, and care becomes suffocation. Operating from fear of harm, change, or loss, they build walls so high that nothing new can enter. It may manifest as distrust, or resistance to allowing others to navigate their own journey.","sq":"Where are you shielding yourself or others from growth?"},{"k":"magician","t":"The Magician","cap":"Master of wonder & awe through the unexpected","g":"This card is calling you to step into your creative power. Recognize the tools at your disposal, and use them with intention. Whether through art, words, or action, you have the ability to inspire and transform. Trust in your craft, embrace the mystery, and remember that magic is not just in what you create but in how you share it with the world.","q":"What illusions are you ready to shatter to reveal the deeper magic within?","s":"The shadow of the Magician archetype emerges whilst the Magician is caught in the endless pursuit of more and forgets to look up. There is stillness between spells and true magic waits, yet they are consumed by the need to prove their power. They chase the next ritual, the next sacred object, the next spark of awe, forgetting that the greatest magic is often found in the ordinary, the breath, the quiet unfolding of now. In the Shadow, they cease to listen, to witness, to BE. They forget that presence is power. That just being, in full authenticity, in heartful stillness, is a portal to the miraculous. They over-identify with doing, performing, crafting... forgetting the inherent magic in their being.","sq":"How can you pay more attention to miracles that are unfolding around you?"},{"k":"muse","t":"The Muse","cap":"Sparks creativity & inspiration with authentic beauty","g":"The Muse reminds us that creation is not just about doing; it's about feeling, believing, and becoming. This card is calling you to embrace your unique magic and share it with the world. Whether through art, words, ideas or energy, you have the power to inspire those around you. Let your presence spark something in others: remind them of what is possible when imagination leads the way.","q":"How can you become a living invitation for inspiration?","s":"The shadow of the Muse is elusiveness, self-doubt, and ungrounded inspiration. While they have the power to ignite creativity in others, they may struggle to channel their own brilliance into tangible action. The Muse's energy can become overwhelming or chaotic, flooding others with too many ideas without grounding them in reality, leaving ideas half-formed and unfinished.","sq":"Are you inspiring others while also nurturing your own creativity?"},{"k":"mother","t":"The Mother","cap":"The heart of creation & the power of love","g":"This card suggests you are in a phase of nurturing something important, whether it's a dream, a community, or your own healing. The Mother reminds you to honor cycles, understanding that all seeds of creation must be planted, tended, and allowed to grow in their own time.","q":"What needs nurturing in your life so that it can flourish?","s":"When reversed, the Mother archetype can indicate self-sacrifice to the point of depletion or over-protection that stifles growth. The shadow of the Mother emerges when nurturing turns into control, martyrdom, or smothering. Instead of fostering growth, she may overprotect, manipulate, or make others dependent on her care. Are you nurturing from a place of abundance, or are you pouring from an empty cup? Are you holding on too tightly to something that needs space to evolve? This could also be a sign of neglect, a reminder that true care must include your own well-being.","sq":"Where do you need to trust the natural flow of growth and change?"},{"k":"sage","t":"The Sage","cap":"Storyteller & keeper of wisdom, finding deeper meaning in every moment","g":"This card calls you to embrace your inner wisdom: not just the knowledge you've gathered from books or teachings, but the deep, intuitive knowing that comes from lived experience. Share this knowledge with others. Your experiences hold value. Who might benefit from your insights?","q":"Where in your life can you embrace a beginner's mindset, allowing curiosity to dissolve old paradigms and reveal a new truth?","s":"Instead of guiding others with insight, the shadow Sage may hoard knowledge rather than share it. The shadow Sage may also develop an over-reliance on intellect, avoiding emotional depth or personal connection. Their endless seeking may trap them in a cycle of learning but not applying, using learning as an escape from action. Or, they may reject perspectives that challenge their beliefs, clinging to rigid opinions and becoming isolated in their pursuit of understanding. Trapped in their own intellectual arrogance, the shadow emerges as dismissive and detached, refusing to acknowledge the wisdom found in different perspectives.","sq":"Where in your life can you embrace a beginner's mindset, allowing curiosity to dissolve old paradigms and reveal a new truth?"},{"k":"seeker","t":"The Seeker","cap":"Follows intuition with a spirit of exploration","g":"This card is calling you to embrace the unknown with wonder, to ask the big questions, and to trust that every step forward reveals new layers of truth. Follow your curiosity, let it lead you beyond the familiar, and open yourself to the lessons hidden in each experience.","q":"What truth is waiting to be uncovered if you dare to look beyond the surface?","s":"While the Seeker embodies curiosity, growth, and the pursuit of deeper truths, its shadow emerges when the journey becomes an endless chase, never satisfied, never arriving. The Seeker becomes restless, ungrounded, and addicted to the quest itself, believing that the next book, the next teacher, or the next experience will finally provide the answers they crave. This can lead to spiritual bypassing, where they avoid sitting with discomfort or integrating what they've already learned.","sq":"What would happen if you stopped searching and allowed yourself to simply be?"},{"k":"trickster","t":"The Trickster","cap":"Playfully unpredictable creating moments of joy & chaos","g":"This card is calling you to shake up your life, embrace spontaneity, release attachment to plans, and find more room for creativity and play.","q":"Where can you surrender to the chaos and discover new solutions where familiar ones are no longer working?","s":"While the Trickster is incredibly intelligent and witty, the shadow side can use wit as a weapon, turning jokes into a tool for hiding vulnerability behind sarcasm. Their cleverness becomes a mask, their surprises a means of control. Constantly caught up in the whirlwind, the Trickster can forget to read the room and tune into the sensitivity or emotional needs of others.","sq":"Where might you have a tendency to distract, creating unnecessary chaos that derails progress rather than sparking transformation?"},{"k":"wildone","t":"The Wild One","cap":"Untamed spirit channeling raw energy embodying liberation & fearless creativity","g":"When this card appears, it is calling you to unleash your inner fire. Your wild ideas and rebellious nature are exactly what is needed. Stop overthinking and start doing. Break the rules that once bound you. The Wild One does not conform: they rewrite the script with courage and joy. Trust your instincts. Creativity doesn't come from playing it safe. Take the leap, say yes to adventure, and let your heart lead the way. Inspire others by being your fullest self. Your authenticity gives others permission to embrace their own.","q":"Where are you craving freedom, and what fears are keeping you from fully stepping into it?","s":"The Wild One's raw and electrifying energy, if unchecked, can turn passion into chaos, freedom into recklessness. Pushing boundaries is powerful, but not at the expense of collaboration. The shadow of this card warns against burning bridges, chasing novelty without depth, or ignoring the impact of your actions. The Wild One's instinct is to roam, but this can turn into running from commitment, dodging accountability, a refusal to listen to others or the inability to see things through. When ungrounded, the Wild One can often mistake impulse for intuition, acting on every whim without discernment.","sq":""}];

  function seedRing() {
    var s = '<div class="seedring"><svg viewBox="0 0 170 170" role="img" aria-label="The Seed: ' + rand(SEED.raised) + ' raised of ' + rand(SEED.target) + '"><defs><linearGradient id="sg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#14A8E0"/><stop offset="1" stop-color="#D8197F"/></linearGradient></defs>';
    var prev = 0;
    SEED.milestones.forEach(function (m, i) {
      var part = Math.max(0, Math.min(1, (SEED.raised - prev) / (m[1] - prev))), a = i * 72;
      s += '<g transform="rotate(' + a + ' 85 85)"><clipPath id="sc' + i + '"><rect x="60" y="' + (82 - 70 * part) + '" width="50" height="' + (70 * part) + '"/></clipPath>'
        + '<path d="M85 82 C 68 60, 72 26, 85 12 C 98 26, 102 60, 85 82 Z" fill="none" stroke="var(--rule-2)" stroke-width="1.2"/>'
        + (part > 0 ? '<path d="M85 82 C 68 60, 72 26, 85 12 C 98 26, 102 60, 85 82 Z" fill="url(#sg)" clip-path="url(#sc' + i + ')"/>' : '') + '</g>';
      prev = m[1];
    });
    s += '<circle cx="85" cy="85" r="13" fill="var(--ink)"/></svg><ul><li><b>' + rand(SEED.raised) + '</b> raised so far, of ' + rand(SEED.target) + '</li>'
      + SEED.milestones.map(function (m) { return '<li>' + m[0] + ' <span>at ' + rand(m[1]) + '</span></li>'; }).join('') + '</ul></div>';
    return s;
  }

    if (t.dataset.bead != null) { var b = P.beads[+t.dataset.bead]; document.querySelectorAll('.bead').forEach(function (x) { x.setAttribute('aria-expanded', String(x === t)); }); $('beadsay').textContent = b[1]; return; }
    if (t.id === 'turnOwn') { myOpen = !myOpen; $('own').classList.toggle('turned', myOpen); t.setAttribute('aria-pressed', String(myOpen)); t.textContent = myOpen ? 'Turn it back' : 'Hear your card'; return; }
    if (t.id === 'drawBtn' || t.id === 'drawAgain') { draw(t.id === 'drawAgain'); return; }
    if (t.id === 'flipDrawn') { var c = $('dcard'); c.classList.toggle('turned'); return; }
    if (t.id === 'keepDrawn' && P.live) save({ kept: (LIVE.store.kept || []).concat([{ k: drawn.k, at: (LIVE.store.last || {}).at || Date.now() }]) });
    if (t.id === 'keepDrawn') { P.beads.push(['given', 'A message kept: ' + drawn.t + '.']); var bs = document.querySelector('.beads'); bs.insertAdjacentHTML('beforeend', '<button type="button" class="bead" style="background:var(--magenta)" data-bead="' + (P.beads.length - 1) + '" aria-expanded="false" aria-label="A bead for something kept"></button>'); $('beadsay').textContent = 'Kept. A bead joins your string, and the message lives in your thread.'; t.disabled = true; return; }
    if (t.dataset.t) { var tk = $('t-' + t.dataset.t), o = !tk.classList.contains('open'); tk.classList.toggle('open', o); tk.querySelector('.tbody').inert = !o; t.setAttribute('aria-expanded', String(o)); return; }
    if (t.dataset.yes) { yes(t.dataset.yes, t); return; }
    if (t.id === 'notNow') { var alt = upcoming().filter(function (x) { return x.set && x.kind === 'talk'; })[0]; t.closest('.letter').querySelector('p').textContent = 'Of course. Here is a gentler door: ' + alt.title + ', ' + fmt(alt.date) + ', online, an hour, from your couch. We won\u2019t ask about the other one again this month.'; t.remove(); var y = document.querySelector('#letter [data-yes]'); y.dataset.yes = alt.id; y.textContent = 'I\u2019ll listen in'; return; }
    if (t.matches('[data-open-door]')) { var dr = $('door'); dr.open = true; scrollTo2(dr); dr.querySelector('summary').focus({ preventScroll: true }); return; }
    if (t.dataset.step != null) { var k = +t.dataset.step; if (steps[k] === 'ok') return; steps[k] = steps[k] === 'mine' ? '' : 'mine'; $('steps').innerHTML = stepsHtml(); var nb = document.querySelector('[data-step="' + k + '"]'); if (nb) nb.focus(); return; }
    if (t.dataset.ics) { var ev2 = EVENTS.events.filter(function (x) { return x.id === t.dataset.ics; })[0]; var ok = !ARTIFACT && download(ev2.id + '.ics', ics(ev2), 'text/calendar'); say(t, ok ? 'Your calendar file is downloading. Adding it again updates the same entry.' : 'On the site this saves a calendar file. (Nothing downloads in this copy.)'); return; }
    if (t.dataset.follow) { say(t, 'You will hear how The Seed rises. The way into the camp is through a camp lead.'); return; }
    if (t.dataset.proto) { say(t, 'In the prototype: ' + t.dataset.proto); return; }
    if (t.id === 'tellSend' && P && P.live) { var tl = $('tellText').value.trim(); if (!tl) { $('tellSaid').textContent = 'Write a line first, then send.'; return; } var row = { page: 'Your Mahala', part: $('tellWhere').value, text: tl.slice(0, 2000), ranked: $('tellRank').value.trim().slice(0, 1000), at: Date.now() };
      $('tellSaid').textContent = 'Sending\u2026'; LIVE.db.doc('signups/' + LIVE.uid + '/tellus/' + row.at.toString(36)).set(row).then(function () { LIVE.tell.push(row); $('yours').insertAdjacentHTML('afterbegin', '<li>' + esc(tl) + '<small>Heard. The stewards answer within a week.</small></li>'); $('tellText').value = ''; $('tellRank').value = ''; $('tellSaid').textContent = 'Thank you. It has reached the stewards.'; }, function () { $('tellSaid').textContent = 'That did not send. Try again in a little while.'; }); return; }
    if (t.id === 'tellSend') { var tx = $('tellText').value.trim(); if (!tx) { $('tellSaid').textContent = 'Write a line first, then send.'; return; } $('yours').insertAdjacentHTML('afterbegin', '<li>' + esc(tx) + '<small>Heard. The stewards answer within a week.</small></li>'); $('tellText').value = ''; $('tellRank').value = ''; $('tellSaid').textContent = 'Thank you. It is in the stewards\u2019 feedback log with the part you chose.'; return; }
  });
  document.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('way')) { ev.preventDefault(); petal(ev.target); } });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset.consent && P.live) { var sc = t.dataset.consent, on = t.checked; M().rpc('set_consent', { p_scope: sc, p_granted: on }).then(function () { $('choiceSaid').textContent = CONSENT.filter(function (c) { return c[0] === sc; })[0][1] + ': ' + (on ? 'yes' : 'no') + '. Saved.'; LIVE.P.consent[sc][0] = on; }, function () { t.checked = !on; t.parentNode.querySelector('.yn').textContent = !on ? 'Yes' : 'No'; $('choiceSaid').textContent = 'That did not save. Try again.'; }); }
    if (t.dataset.consent) { P.consent[t.dataset.consent][0] = t.checked; t.parentNode.querySelector('.yn').textContent = t.checked ? 'Yes' : 'No'; if (t.dataset.consent === 'directory') { var keep = t.checked; renderChoices(); var n = $('choicesIn').querySelector('[data-consent="directory"]'); if (n) n.focus(); $('choiceSaid').textContent = keep ? 'Members can now find you. Choose below what they see.' : 'Hidden from other members. Anything set to Members is back with the stewards.'; if (!keep) Object.keys(P.fields).forEach(function (f) { if (P.fields[f] === 'members') P.fields[f] = 'stewards'; }); } return; }
    if (t.dataset.field && P.live) { $('choiceSaid').textContent = 'Press Save beside it to keep the change.'; return; }
    if (t.dataset.field) { P.fields[t.dataset.field] = t.value; $('choiceSaid').textContent = FIELD_NAMES[t.dataset.field][0] + ': now seen by ' + t.options[t.selectedIndex].text.toLowerCase() + '. (Not saved in the prototype.)'; }
  });

  function petal(g) {
    var k = g.dataset.petal, pt = PETALS.filter(function (x) { return x[0] === k; })[0], openP = P.open.indexOf(k) >= 0;
    document.querySelectorAll('.wayc').forEach(function (x) { x.classList.toggle('sel', x.getAttribute('data-c') === g.dataset.petal); });
    $('petalsay').innerHTML = '<strong>' + esc(pt[1]) + '.</strong> ' + esc(openP ? pt[2] : 'Open to you. ' + pt[3]);
  }

  function yes(id, btn) {
    var e = EVENTS.events.filter(function (x) { return x.id === id; })[0]; if (!e) return;
    var cur = P.yes[id], next = cur ? '' : (e.set ? 'yes' : 'hold');
    if (next) P.yes[id] = next; else delete P.yes[id];
    if (P.live) save({ yes: P.yes });
    var tk = $('t-' + id), was = tk && tk.classList.contains('open');
    if (tk) { tk.outerHTML = ticket(e); tk = $('t-' + id); if (next || was) { tk.classList.add('open'); tk.querySelector('.tbody').inert = false; tk.querySelector('.head').setAttribute('aria-expanded', 'true'); } }
    if (btn && btn.hasAttribute('data-from-letter')) { btn.setAttribute('aria-pressed', String(!!next)); btn.textContent = next ? 'See you there, ' + P.playa : 'I\u2019ll come'; say(btn, next ? 'It\u2019s on your page, in the Mahalaverse, and in the hosts\u2019 count. The details are open below.' : ''); if (next && tk) scrollTo2(tk); }
    else { var b2 = tk && tk.querySelector('[data-yes]'); if (b2) b2.focus(); if (tk) say(tk.querySelector('[data-said]'), next === 'yes' ? 'Going. It shows on your page and in the Mahalaverse; the hosts see one more in their count.' : next === 'hold' ? 'Held for you. We\u2019ll tell you when the date is set.' : 'Taken back. Nothing else changes.'); }
  }

  // draw a message: once each new moon, and once after each gathering you come to
  function draw(again, keep) {
    if (!drawsLeft && !again && !keep) return;
    drawsLeft = 0;
    var pool = DECK.filter(function (c) { return !drawn || c.k !== drawn.k; });
    drawn = keep ? DECK.filter(function (c) { return c.k === keep.k; })[0] : pool[Math.floor(Math.random() * pool.length)];
    if (!drawn) return;
    var reversed = keep ? !!keep.rev : Math.random() < .25, mirror = drawn.k === P.card;
    if (P.live && !keep) save({ last: { k: drawn.k, rev: reversed, at: Date.now() } });
    var kept = P.live && (LIVE.store.kept || []).some(function (x) { return x.k === drawn.k && x.at === (LIVE.store.last || {}).at; });
    var nm = nextNewMoon(TODAY), nmTxt = DAYS[nm.getDay()] + ' ' + nm.getDate() + ' ' + MON[nm.getMonth()];
    $('drawn').innerHTML = '<div class="card draw" id="dcard"><div class="face front"><img src="' + IMG('back') + '" alt="The back of a card from the deck"></div><div class="face back" style="padding:0"><img src="' + IMG(drawn.k) + '" alt="' + esc(drawn.t) + '"></div></div>'
      + '<div class="msg" aria-live="polite"><q>' + esc(reversed ? drawn.sq : drawn.q) + '</q>' + esc(reversed ? drawn.s : drawn.g) + '<span>' + esc(drawn.t) + (reversed ? ', its shadow side' : '') + (mirror ? ' · The mirror: you drew your own card' : '') + '</span></div>'
      + '<div class="row" style="justify-content:center"><button type="button" class="btn small ghost" id="keepDrawn"' + (kept ? ' disabled>Kept' : '>Keep this') + '</button></div>'
      + '<p class="beadsay">The deck rests until the new moon on ' + nmTxt + '.' + (P.live ? '' : ' Each gathering you come to opens another draw. <button type="button" class="link" id="drawAgain">Draw again (example only)</button>') + '</p>';
    $('drawBtn').disabled = true; $('drawBtn').textContent = keep ? 'Drawn this moon' : 'Drawn';
    var c = $('dcard'); if (keep) c.classList.add('turned'); else setTimeout(function () { c.classList.add('turned'); }, REDUCE ? 0 : 450);
  }

  addEventListener('hashchange', function () { if (LIVE.out && !PEOPLE[hashKey()]) signedOut(); else render(); scrollTo(0, 0); });
  boot();
})();
